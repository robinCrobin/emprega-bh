name: Verificacao da base
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: empregabh_test
          POSTGRES_USER: empregabh_test
          POSTGRES_PASSWORD: ci_only_temporary_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U empregabh_test -d empregabh_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PYTHONPATH: backend
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      POSTGRES_DB: empregabh_test
      POSTGRES_USER: empregabh_test
      POSTGRES_PASSWORD: ci_only_temporary_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --require-hashes -r backend/requirements-dev.txt
      - run: python -m unittest discover -s backend/tests -v
      - name: Verificar conexao real do endpoint de prontidao
        run: >-
          python -c "from fastapi.testclient import TestClient;
          from app.main import app;
          r=TestClient(app).get('/readyz');
          assert r.status_code == 200, r.text"
  modelagem:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: empregabh_test
          POSTGRES_USER: empregabh_test
          POSTGRES_PASSWORD: ci_only_temporary_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U empregabh_test -d empregabh_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      POSTGRES_DB: empregabh_test
      POSTGRES_USER: empregabh_test
      POSTGRES_PASSWORD: ci_only_temporary_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: modelagem/requirements.txt
      - run: python -m pip install --require-hashes -r modelagem/requirements.txt
      - run: python -m unittest discover -s modelagem/tests -t . -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python scripts/setup_env.py
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: python scripts/check_stack.py
      - if: failure()
        run: docker compose logs --no-color --tail=100
      - if: always()
        run: docker compose down
